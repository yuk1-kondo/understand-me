<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=576, height=288, initial-scale=1">
<title>Understand Me — Even G2</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="display">
    <!-- ===== Caption view ===== -->
    <section id="view-captions" class="view active">
      <header class="bar">
        <span class="title">Understand Me</span>
        <span id="conn" class="conn">DEMO</span>
      </header>
      <div id="caption-list"></div>
      <div id="checksum-alert" class="alert hidden">▲ Confirmation card (Tab)</div>
      <footer class="hint" id="cap-footer">Tab: view card</footer>
    </section>

    <!-- ===== Checksum card view ===== -->
    <section id="view-checksum" class="view">
      <header class="bar">
        <span class="title" id="cs-title">Double-check</span>
        <span id="checksum-state" class="conn">—</span>
      </header>
      <div id="checksum-body">
        <div id="checksum-empty" class="empty">Nothing to confirm</div>
        <div id="checksum-card" class="card hidden">
          <div class="slot" id="cs-slot">deadline</div>
          <div class="row"><span class="label" id="cs-label-original">Said</span><span class="val" id="cs-original">Thursday</span></div>
          <div class="row heard"><span class="label" id="cs-label-heard">Heard</span><span class="val" id="cs-heard">Friday</span></div>
          <div class="choices">
            <div class="choice" id="choice-confirm">Confirm</div>
            <div class="choice" id="choice-send">Record correction</div>
          </div>
        </div>
        <div id="checksum-done" class="empty hidden">Recorded</div>
      </div>
      <footer class="hint" id="cs-footer">←→: select  Enter: OK  Tab: captions</footer>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
